<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Zoravia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
        }

        .icon-box {
            font-size: 50px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #1a1a1a, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-weight: 300;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 40px;
        }

        .mood-tag {
            display: inline-block;
            padding: 5px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
            color: #888;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            background: #333;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">⚙️</div>
        <h1>SORRY.</h1>
        <p>
            Website <strong>Zoravia</strong> sedang dalam perbaikan besar-besaran. 
            Lama pengerjaan sangat bergantung pada <strong>mood Admin</strong> hari ini.
            <br>
            <span class="mood-tag">Status: Admin sedang ngopi ☕</span>
        </p>
        
        <a href="https://website-zoravia-resmi.vercel.app" class="btn-back">KEMBALI</a>
    </div>

</body>
</html>
