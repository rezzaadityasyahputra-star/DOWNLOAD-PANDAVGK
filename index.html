<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoravia United - Klasemen</title>
    <style>
        /* Gaya Dasar & Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        /* Nama Web di Atas */
        .site-header {
            font-size: 24px;
            font-weight: 800;
            color: #1a73e8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Container Gambar Klasemen */
        .image-box {
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        /* Tombol Kembali dengan Animasi */
        .btn-kembali {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            color: #1a73e8;
            text-decoration: none;
            background-color: #ffffff;
            border: 2px solid #1a73e8;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.2);
        }

        /* Efek Hover Animasi */
        .btn-kembali:hover {
            background-color: #1a73e8;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(26, 115, 232, 0.4);
        }

        .btn-kembali:active {
            transform: scale(0.95);
        }

        .btn-icon {
            margin-right: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="site-header">ZORAVIA UNITED</div>

        <div class="image-box">
            <img src="https://i.ibb.co.com/mr17Vf2F/image.png" alt="Klasemen Zoravia United">
        </div>

        <a href="https://website-zoravia-resmi.vercel.app/" class="btn-kembali">
            <span class="btn-icon">☜</span> KEMBALI KE HASIL LAGA
        </a>
    </div>

</body>
</html>
